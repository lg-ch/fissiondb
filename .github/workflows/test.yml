name: Native engine
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y gcc make liburing-dev libroaring-dev libxxhash-dev libcurl4-openssl-dev
      - run: python -m pip install numpy pytest build
      - run: make product
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 make test
      - run: python -m build
